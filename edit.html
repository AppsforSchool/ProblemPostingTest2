<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>問題集を編集</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="editStyle.css">
  <link rel="stylesheet" href="appDialogStyle.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div id="loading-overlay" class="">
    <h1>loading...</h1>
    <p id="loading-status-text">読み込んでいます｡</p>
  </div>

  <div id="no-permission-overlay" class="hidden">
    <h1>編集できません</h1>
    <p>この問題集を編集する権限がありません。</p>
    <button id="no-permission-home-button" class="answer-next-button">ホームにもどる</button>
  </div>

  <header id="app-header">
    <div id="title-area">
      <a href="./app.html" id="back-button" aria-label="一覧に戻る">&larr;</a>
      <p id="header-title">問題集を編集</p>
    </div>
  </header>

  <main>
    <div class="make-container">

      <section class="make-section">
        <p class="make-section-title">基本情報</p>

        <label class="make-label" for="book-title-input">タイトル</label>
        <input type="text" id="book-title-input" placeholder="例: 近世の日本" maxlength="60">

        <label class="make-label" for="book-description-input">説明</label>
        <textarea id="book-description-input" placeholder="どんな問題集か説明を書きましょう" maxlength="200"></textarea>

        <div id="made-by-area" class="hidden">
          <label class="make-label" for="book-madeBy-input">作成者のユーザーID（管理者のみ変更可）</label>
          <input type="text" id="book-madeBy-input" placeholder="userId">
        </div>

        <div class="make-inline-fields">
          <div class="make-inline-field">
            <label class="make-label" for="book-subject-select">教科</label>
            <select id="book-subject-select">
              <option value="0">不明</option>
              <option value="1">国語</option>
              <option value="2">数学</option>
              <option value="3">理科</option>
              <option value="4">英語</option>
              <option value="5">社会(歴史)</option>
              <option value="6">社会(地理)</option>
              <option value="7">社会(公民)</option>
              <option value="8">保健体育(保健)</option>
              <option value="9">保健体育(実技)</option>
            </select>
          </div>
          <div class="make-inline-field">
            <label class="make-label" for="book-grade-select">学年</label>
            <select id="book-grade-select">
              <option value="0">不明</option>
              <option value="1">1年</option>
              <option value="2">2年</option>
              <option value="3">3年</option>
              <option value="4">総合</option>
            </select>
          </div>
        </div>

        <label class="shuffle-choices-option">
          <input type="checkbox" id="book-shuffle-problems-checkbox">
          <span>問題の出題順のシャッフルを許可する</span>
        </label>

        <label class="make-label">公開設定</label>
        <div class="answer-type-selector">
          <label class="answer-type-option">
            <input type="radio" class="book-visibility-radio" name="book-visibility" value="public" checked>
            <span>公開</span>
          </label>
          <label class="answer-type-option">
            <input type="radio" class="book-visibility-radio" name="book-visibility" value="private">
            <span>非公開</span>
          </label>
        </div>
        <p id="visibility-locked-message" class="visibility-locked-message hidden">一度公開した問題集は非公開に戻せません。</p>
      </section>

      <section class="make-section">
        <div class="make-section-header">
          <p class="make-section-title">問題</p>
          <div class="import-export-buttons">
            <button id="import-json-button" type="button" class="io-button">JSON読込</button>
            <button id="export-json-button" type="button" class="io-button">JSON書出</button>
          </div>
        </div>
        <p class="io-hint">AIで作った問題をJSON形式で読み込んだり、現在の内容をJSONとして書き出せます。読み込むと現在の問題リストは置き換わります。</p>
        <input type="file" id="import-json-file-input" accept="application/json,.json" class="hidden">

        <div id="problems-list"></div>

        <button id="add-problem-button" type="button" class="add-button">＋ 問題を追加</button>
      </section>

      <button id="submit-button" type="button" class="submit-button">この内容で更新する</button>
      <button id="delete-book-button" type="button" class="delete-button">この問題集を削除する</button>
    </div>
  </main>

  <div id="app-dialog-modal" class="modal-overlay hidden">
    <div class="modal-content app-dialog-content">
      <p id="app-dialog-title" class="app-dialog-title hidden"></p>
      <p id="app-dialog-message" class="app-dialog-message"></p>
      <div class="app-dialog-actions">
        <button id="app-dialog-ok-button">OK</button>
        <button id="app-dialog-cancel-button" class="hidden">キャンセル</button>
      </div>
    </div>
  </div>

  <template id="problem-template">
    <div class="problem-card">
      <div class="problem-card-header">
        <p class="problem-card-title"></p>
        <button type="button" class="remove-problem-button" aria-label="この問題を削除">&times;</button>
      </div>

      <label class="make-label">問題文</label>
      <textarea class="problem-text-input" placeholder="問題文を入力"></textarea>

      <label class="make-label">画像（任意）</label>
      <div class="problem-image-area">
        <div class="problem-image-preview-wrap hidden">
          <img class="problem-image-preview" alt="プレビュー画像">
          <button type="button" class="remove-image-button">画像を削除</button>
        </div>
        <button type="button" class="select-image-button">＋ 画像を選択</button>
        <input type="file" class="image-file-input hidden" accept="image/*">
      </div>

      <label class="make-label">回答形式</label>
      <div class="answer-type-selector">
        <label class="answer-type-option">
          <input type="radio" class="answer-type-radio" value="single" checked>
          <span>単数選択</span>
        </label>
        <label class="answer-type-option">
          <input type="radio" class="answer-type-radio" value="multiple">
          <span>複数選択</span>
        </label>
        <label class="answer-type-option">
          <input type="radio" class="answer-type-radio" value="text">
          <span>単語記述</span>
        </label>
        <label class="answer-type-option">
          <input type="radio" class="answer-type-radio" value="descriptive">
          <span>記述</span>
        </label>
      </div>

      <div class="choices-area-wrap">
        <label class="make-label">選択肢（正解にはチェックを入れてください）</label>
        <div class="choices-list"></div>
        <button type="button" class="add-choice-button">＋ 選択肢を追加</button>
        <label class="shuffle-choices-option">
          <input type="checkbox" class="shuffle-choices-checkbox">
          <span>選択肢のシャッフルを許可する</span>
        </label>
      </div>

      <div class="text-answers-area hidden">
        <label class="make-label">正解となる文字列（表記ゆれ・ひらがな/カタカナなど複数設定できます）</label>
        <div class="text-answers-list"></div>
        <button type="button" class="add-text-answer-button">＋ 正解を追加</button>
      </div>

      <div class="descriptive-answer-area hidden">
        <label class="make-label">模範解答</label>
        <textarea class="model-answer-input" placeholder="模範解答を入力"></textarea>

        <label class="make-label">採点基準（任意）</label>
        <textarea class="grading-criteria-input" placeholder="AIが採点する際の基準を書きましょう（省略可）"></textarea>
      </div>

      <label class="make-label">解説（任意）</label>
      <textarea class="explanation-input" placeholder="正解の理由などを書きましょう（省略可）"></textarea>
    </div>
  </template>

  <template id="choice-template">
    <div class="choice-row">
      <label class="choice-correct-label">
        <input type="checkbox" class="choice-correct-checkbox">
        <span>正解</span>
      </label>
      <input type="text" class="choice-text-input" placeholder="選択肢を入力">
      <button type="button" class="remove-choice-button" aria-label="この選択肢を削除">&times;</button>
    </div>
  </template>

  <template id="text-answer-template">
    <div class="text-answer-row">
      <input type="text" class="text-answer-input" placeholder="正解の文字列を入力">
      <button type="button" class="remove-text-answer-button" aria-label="この正解を削除">&times;</button>
    </div>
  </template>

  <script src="appDialog.js"></script>
  <script src="editScript.js"></script>
</body>
</html>
