<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>みんなで解く - 進行管理</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liveStyle.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body class="host-body">
  <div id="loading-overlay">
    <h1>loading...</h1>
    <p id="loading-status-text">読み込んでいます｡</p>
  </div>

  <div id="no-permission-overlay" class="hidden">
    <h1>アクセスできません</h1>
    <p>この問題集の主催者のみアクセスできます。</p>
    <a href="./app.html" class="live-next-button">ホームにもどる</a>
  </div>

  <header id="live-header">
    <span class="live-header-badge">HOST</span>
    <p id="host-title-text">loading...</p>
    <button id="end-live-early-button" class="end-live-early-button hidden" aria-label="募集を打ち切る">打ち切る</button>
    <button id="audio-mute-button" class="audio-mute-button" aria-label="音を切り替える"></button>
  </header>

  <main class="live-main">

    <section id="phase-session-missing" class="live-phase hidden">
      <p class="live-phase-title">セッション情報が見つかりません</p>
      <p class="waiting-result-hint">募集を開始した際にライブ用のデータが作成されていなかった可能性があります。募集状態をリセットして、もう一度「みんなで解く」からやり直してください。</p>
      <button id="reset-session-button" class="live-next-button">募集をリセットしてホームにもどる</button>
    </section>

    <section id="phase-waiting" class="live-phase hidden">
      <p class="live-phase-title">参加者を待っています</p>
      <p class="waiting-count-text">参加者 <span id="waiting-participants-count">0</span> 人</p>

      <p class="waiting-time-limit-label">1問あたりの制限時間</p>
      <div id="waiting-time-limit-options" class="time-limit-options">
        <button type="button" class="time-limit-option" data-value="5">5</button>
        <button type="button" class="time-limit-option active" data-value="10">10</button>
        <button type="button" class="time-limit-option" data-value="20">20</button>
        <button type="button" class="time-limit-option" data-value="30">30</button>
        <button type="button" class="time-limit-option" data-value="60">60</button>
        <button type="button" class="time-limit-option" data-value="0">∞</button>
      </div>

      <div id="waiting-participants-list" class="participants-list"></div>
      <button id="start-session-button" class="live-next-button start-button-glow">スタート</button>
      <button id="cancel-recruitment-button" class="live-secondary-button">募集を打ち切る</button>
    </section>

    <section id="phase-countdown" class="live-phase hidden">
      <p class="countdown-label">まもなく開始します</p>
      <p id="countdown-number" class="countdown-number">3</p>
    </section>

    <section id="phase-question" class="live-phase hidden">
      <div class="question-top-row">
        <p id="question-index-text" class="question-index-text"></p>
        <p id="question-answered-count" class="question-answered-count"></p>
      </div>
      <div class="timer-bar-track">
        <div id="question-timer-bar" class="timer-bar-fill"></div>
      </div>
      <p id="question-timer-text" class="question-timer-text"></p>

      <p id="host-question-text" class="host-question-text"></p>
      <img id="host-question-image" class="host-question-image hidden" alt="問題の画像">
      <div id="host-choices-area" class="host-choices-area"></div>

      <button id="cutoff-button" class="live-secondary-button">この問題の受付を締め切る</button>
    </section>

    <section id="phase-grading" class="live-phase hidden">
      <p class="live-phase-title">記述式の採点</p>
      <p id="grading-hint-text" class="grading-hint-text"></p>
      <div id="grading-submissions-area" class="grading-submissions-area"></div>
      <p id="grading-error-text" class="grading-error-text hidden"></p>
      <button id="request-ai-grading-button" class="live-next-button">AIに一括採点を依頼</button>
    </section>

    <section id="phase-results" class="live-phase hidden">
      <p class="live-phase-title">この問題の結果</p>
      <div id="results-correct-area" class="results-correct-area"></div>
      <p class="leaderboard-heading">現在の順位</p>
      <div id="results-leaderboard-area" class="leaderboard-area"></div>
      <button id="next-question-button" class="live-next-button">次の問題へ</button>
    </section>

    <section id="phase-finished" class="live-phase hidden">
      <p class="live-phase-title finished-title">結果発表 🎉</p>
      <div id="finished-leaderboard-area" class="leaderboard-area"></div>
      <div id="finished-buttons-area" class="finished-buttons-area hidden">
        <button id="finished-home-button" class="live-next-button">問題集一覧にもどる</button>
      </div>
    </section>

  </main>

  <script src="liveAudio.js"></script>
  <script src="liveHostScript.js"></script>
</body>
</html>
